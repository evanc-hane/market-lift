[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "marketlift"
version = "0.1.0"
description = "Marketplace experimentation and causal inference decision platform."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "Evan Cui", email = "evan.cui1022@gmail.com" }
]
dependencies = [
  "duckdb>=1.2,<2",
  "numpy>=2.0,<2.5",
  "pandas>=2.2,<4",
  "plotly>=6,<7",
  "scipy>=1.13,<2",
  "statsmodels>=0.14,<1",
  "streamlit>=1.45,<2",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
]

[project.scripts]
marketlift-simulate = "marketlift.cli:simulate_main"
marketlift-build = "marketlift.cli:build_main"
marketlift-analyze = "marketlift.cli:analyze_main"
marketlift-run = "marketlift.cli:run_main"

[tool.hatch.build.targets.wheel]
packages = ["src/marketlift"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
files = ["src/marketlift/config.py", "src/marketlift/cli.py"]
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true

